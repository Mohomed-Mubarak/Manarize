/* Critical above-fold CSS — inlined for FCP */
:root{--clr-bg:#0d0f14;--clr-bg-2:#12151c;--clr-surface:#1e2330;--clr-border:#2a3045;--clr-gold:#c9a84c;--clr-gold-bg:rgba(201,168,76,.10);--clr-text:#e8eaf0;--clr-text-2:#a0a8bc;--clr-text-3:#667080;--clr-text-inv:#0d0f14;--nav-h:60px;--ff-display:"Playfair Display",Georgia,serif;--ff-body:"DM Sans",system-ui,sans-serif;--fs-sm:.875rem;--fs-xl:1.25rem;--fw-medium:500;--fw-bold:700;--sp-2:.5rem;--sp-3:.75rem;--sp-4:1rem;--r-md:8px;--t-fast:150ms ease;--t-base:220ms ease;--z-sticky:100}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:var(--ff-body);background:var(--clr-bg);color:var(--clr-text);line-height:1.6;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}

img{max-width:100%;display:block}
.navbar{position:sticky;top:0;z-index:var(--z-sticky);background:rgba(13,15,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--clr-border);height:var(--nav-h);transition:box-shadow var(--t-base)}
.navbar-inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:var(--sp-4);max-width:1280px;margin:0 auto;padding:0 var(--sp-4)}
.navbar-logo{font-family:var(--ff-display);font-size:var(--fs-xl);font-weight:700;color:var(--clr-text);flex-shrink:0}
.navbar-logo span{color:var(--clr-gold)}
.navbar-actions{display:flex;align-items:center;gap:var(--sp-2);flex-shrink:0}
.nav-icon-btn{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-md);color:var(--clr-text-2);cursor:pointer;background:none;border:none}

<body>
  
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="page-loader">
    <div class="loader-logo">Manarize</div>
    <div class="loader-dots"><span></span><span></span><span></span></div>
  </div>
  <div id="page-progress"></div>
  <div id="toast-container"></div>

  <main id="main" class="page-enter">
    <div class="page-header">
      <div class="container">
        <div class="breadcrumb" style="margin-bottom:.75rem">
          <a href="index.html">Home</a>
          <span class="breadcrumb-sep"><i class="fa-solid fa-chevron-right" style="font-size:.625rem"></i></span>
          <span class="current" id="breadcrumb-current">Shop</span>
        </div>
        <h1 id="page-title">Shop</h1>
        <p id="page-desc" style="color:var(--clr-text-2)">Discover our curated collection of premium products</p>
      </div>
    </div>

    <div class="container section-sm">
      <!-- Mobile filter toggle -->
      <button class="btn btn-ghost mobile-filter-toggle" id="mobile-filter-btn" style="margin-bottom:1rem">
        <i class="fa-solid fa-sliders"></i> Filters
      </button>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <div class="shop-layout">
        <!-- Sidebar Filters -->
        <aside class="shop-sidebar" id="shop-sidebar">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
            <h3 style="font-size:1rem">Filters</h3>
            <button id="clear-filters" class="btn btn-ghost btn-sm">Clear All</button>
          </div>

          <div class="sidebar-title">Categories</div>
          <div id="cat-filter-list">
            <label class="checkbox-group" style="margin-bottom:.5rem">
              <input type="radio" name="cat" value=""> <span>All Categories</span>
            </label>
          </div>

          <div class="sidebar-title" id="subcat-section-label" style="display:none">Subcategories</div>
          <div id="subcat-filter-list" class="subcat-pills" style="display:none"></div>

          <div class="sidebar-title">Condition</div>
          <label class="checkbox-group" style="margin-bottom:.5rem">
            <input type="radio" name="condition" value=""> <span>All Items</span>
          </label>
          <label class="checkbox-group" style="margin-bottom:.5rem">
            <input type="radio" name="condition" value="new"> <span>New</span>
          </label>
          <label class="checkbox-group" style="margin-bottom:.5rem">
            <input type="radio" name="condition" value="used"> <span>Second Hand / Used</span>
          </label>

          <div class="sidebar-title">Price Range</div>
          <div style="padding:.5rem 0">
            <div
              style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--clr-text-3);margin-bottom:.5rem">
              <span>Rs. <span id="price-min-label">0</span></span>
              <span>Rs. <span id="price-max-label">50,000</span></span>
            </div>
            <input type="range" id="price-max" min="0" max="50000" step="500" value="50000">
          </div>

          <div class="sidebar-title">In Stock Only</div>
          <label class="checkbox-group">
            <input type="checkbox" id="filter-instock"> <span>Show in-stock only</span>
          </label>

          <div class="sidebar-title" style="margin-top:1rem">Tags</div>
          <div id="tag-filter-list" style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.25rem"></div>
        </aside>

        <!-- Products Area -->
        <div>
          <div class="shop-toolbar">
            <span class="shop-results" id="results-count">Loading…</span>
            <div class="shop-toolbar-right">
              <div class="search-bar">
                <input type="text" id="shop-search" placeholder="Search products…">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
              </div>
              <select class="form-control" id="sort-select">
                <option value="featured">Featured</option>
                <option value="newest">Newest</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name A–Z</option>
                <option value="rating">Top Rated</option>
              </select>
            </div>
          </div>

          <!-- Active filters -->
          <div id="active-filters" class="active-filters"></div>

          <!-- Products grid -->
          <div class="products-grid" id="products-grid">
            <!-- Skeleton placeholders -->
            <div class="skeleton" style="height:340px;border-radius:8px"></div>
            <div class="skeleton" style="height:340px;border-radius:8px"></div>
            <div class="skeleton" style="height:340px;border-radius:8px"></div>
            <div class="skeleton" style="height:340px;border-radius:8px"></div>
            <div class="skeleton" style="height:340px;border-radius:8px"></div>
            <div class="skeleton" style="height:340px;border-radius:8px"></div>
          </div>

          <!-- Empty state -->
          <div id="shop-empty" class="empty-state" style="display:none">
            <i class="fa-solid fa-magnifying-glass"></i>
            <h3>No products found</h3>
            <p>Try adjusting your filters or search term.</p>
            <button class="btn btn-outline" id="reset-shop">Reset Filters</button>
          </div>

          <!-- Load more -->
          <div style="text-align:center;margin-top:2.5rem">
            <button id="load-more-btn" class="btn btn-outline" style="display:none">
              <i class="fa-solid fa-plus"></i> Load More Products
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
<script type="module" src="/dist/js/shop.js?v=561e7c7d"></script>
  <script type="module" src="/dist/js/session-guard.js?v=561e7c7d"></script>
</body>
